<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sentence Detective</title><link rel="stylesheet" href="game.css"></head>
<body><header class="top"><a href="../index.html">← На витрину</a><img class="logo" src="../images/logo/logo.svg" alt="TypeGame"><span>Глава 3</span></header><main class="wrap">
<section class="panel" id="start"><h1>Sentence Detective: The Lost Message</h1><p class="lead">Восстановите сообщения, сравните улики и раскройте тайну Книги знаний.</p><div class="choices"><button class="choice active" data-mode="junior">Junior</button><button class="choice" data-mode="explorer">Explorer</button><button class="choice" data-mode="expert">Expert</button></div><br><button class="btn" id="startBtn">Начать расследование</button></section>
<section class="panel hidden" id="game"><div class="hud"><span>Сцена: <b id="scene">1</b>/5</span><span>Очки: <b id="score">0</b></span><span>Подсказки: <b id="hints">3</b></span></div><div class="mission"><h2 id="caseTitle">Crime Scene</h2><p>Нажимайте на слова в правильном порядке.</p></div><h3>Собранное предложение</h3><div class="sentence-line" id="line"></div><h3>Найденные слова</h3><div class="sentence-pool" id="pool"></div><button class="btn" id="checkBtn">Проверить</button> <button class="btn" id="resetBtn">Сбросить</button><div class="feedback" id="feedback"></div></section>
<section class="panel result hidden" id="result"><h2 id="resultTitle"></h2><p class="lead" id="resultText"></p><button class="btn" onclick="location.reload()">Сыграть снова</button> <a class="btn" href="../index.html">На витрину</a></section></main>
<audio id="correctSound" src="../sounds/correct.wav"></audio><audio id="wrongSound" src="../sounds/wrong.wav"></audio><audio id="victorySound" src="../sounds/victory.wav"></audio>
<script>
const cases={junior:['The book is missing','The owl found a key','The fox saw a shadow','The beaver opened the door','The librarian hid the map'],explorer:['The mysterious visitor left the library early','Professor Owl discovered a torn blue ticket','Captain Fox followed footprints to the station','Builder Beaver repaired the secret underground door','The station manager returned the stolen book'],expert:['Although the alarm rang nobody saw the masked visitor','The detective realised that the first witness had lied','A hidden message revealed where the ancient key was kept','Before sunrise the team entered the abandoned clock tower','The evidence proved that the curator had protected the book']};
let mode='junior',i=0,score=0,hints=3,selected=[];const titles=['Crime Scene','Witness Interview','Evidence Lab','Suspect Check','Final Deduction'];const start=document.getElementById('start'),game=document.getElementById('game'),result=document.getElementById('result'),pool=document.getElementById('pool'),line=document.getElementById('line');
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode});
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function draw(){selected=[];line.innerHTML='';pool.innerHTML='';document.getElementById('scene').textContent=i+1;document.getElementById('score').textContent=score;document.getElementById('hints').textContent=hints;document.getElementById('caseTitle').textContent=titles[i];shuffle(cases[mode][i].split(' ')).forEach(w=>{const b=document.createElement('button');b.className='word';b.textContent=w;b.onclick=()=>{selected.push(w);line.appendChild(b)};pool.appendChild(b)})}
document.getElementById('resetBtn').onclick=draw;document.getElementById('checkBtn').onclick=()=>{const built=selected.join(' '),expected=cases[mode][i],f=document.getElementById('feedback');if(built===expected){score+=200;f.textContent='Улика расшифрована!';f.className='feedback correct';document.getElementById('correctSound').play().catch(()=>{});i++;if(i>=5)return finish(true);setTimeout(draw,450)}else{hints--;f.textContent='Порядок неверный.';f.className='feedback wrong';document.getElementById('wrongSound').play().catch(()=>{});document.getElementById('hints').textContent=hints;if(hints<=0)return finish(false)}};
function finish(win){game.classList.add('hidden');result.classList.remove('hidden');document.getElementById('resultTitle').textContent=win?'Mystery solved!':'Investigation paused';document.getElementById('resultText').textContent=win?`Вы раскрыли дело. Очки: ${score}. Книга знаний спасена.`:`Подсказки закончились. Очки: ${score}.`;if(win)document.getElementById('victorySound').play().catch(()=>{});localStorage.setItem('typegame_sentence_complete',win?'1':'0')}
document.getElementById('startBtn').onclick=()=>{i=0;score=0;hints=3;start.classList.add('hidden');game.classList.remove('hidden');draw()};
</script></body></html>
